<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Photic Strobe Utility</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            text-align: center;
            z-index: 10;
            background: rgba(0, 0, 0, 0.85);
            padding: 24px;
            border-radius: 12px;
            max-width: 340px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        select, button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            font-size: 16px;
            border-radius: 6px;
            border: none;
            outline: none;
        }
        select {
            background: #374151;
            color: #fff;
            cursor: pointer;
        }
        button {
            background: #2563eb;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 20px;
        }
        button:hover {
            background: #1d4ed8;
        }
        .warning {
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 16px;
            line-height: 1.4;
        }
        label {
            display: block;
            text-align: left;
            font-size: 14px;
            color: #d1d5db;
            margin-top: 12px;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            margin-top: 16px;
            text-align: left;
            font-size: 14px;
            color: #d1d5db;
            cursor: pointer;
        }
        .checkbox-container input {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h2>Photic Engine</h2>
        <p class="warning">REMINDER: Enable Do Not Disturb before starting to prevent notification flashes.</p>
        
        <label for="freq">Target State (EEG Band):</label>
        <select id="freq">
            <option value="6">6 Hz - Theta (Deep Calm)</option>
            <option value="10" selected>10 Hz - Alpha (Relaxation)</option>
            <option value="18">18 Hz - Beta (Focus)</option>
            <option value="40">40 Hz - Gamma (Cognitive Sync)</option>
            <option value="2.5">2.5 Hz - Low Delta (Modulation)</option>
        </select>

        <label for="time">Session Duration:</label>
        <select id="time">
            <option value="15">15 Minutes</option>
            <option value="20" selected>20 Minutes (Standard)</option>
            <option value="30">30 Minutes</option>
        </select>

        <label class="checkbox-container">
            <input type="checkbox" id="ramp" checked>
            Enable Clinical Ramp (Waking state smooth transition)
        </label>
        
        <button id="startBtn">Start Session</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const ui = document.getElementById('ui');
            const startBtn = document.getElementById('startBtn');
            const freqSelect = document.getElementById('freq');
            const timeSelect = document.getElementById('time');
            const rampCheck = document.getElementById('ramp');
            
            if (!startBtn) return;

            let isRunning = false;
            let startTime = 0;
            let lastTime = 0;
            let state = false;
            let animationFrameId = null;
            let durationMs = 0;

            startBtn.addEventListener('click', () => {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                }

                durationMs = parseInt(timeSelect.value) * 60 * 1000;
                ui.style.display = 'none';
                isRunning = true;
                
                const now = performance.now();
                startTime = now;
                lastTime = now;
                
                requestAnimationFrame(flickerLoop);
            });

            document.addEventListener('fullscreenchange', handleFullscreenExit);
            document.addEventListener('webkitfullscreenchange', handleFullscreenExit);

            function handleFullscreenExit() {
                if (!document.fullscreenElement && !document.webkitFullscreenElement && isRunning) {
                    stopSession();
                }
            }

            document.body.addEventListener('click', (e) => {
                if (isRunning && e.target === document.body) {
                    stopSession();
                }
            });

            function stopSession() {
                isRunning = false;
                cancelAnimationFrame(animationFrameId);
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
                ui.style.display = 'block';
                document.body.style.backgroundColor = '#000';
            }

            function getCurrentHz(elapsed) {
                const targetHz = parseFloat(freqSelect.value);
                if (!rampCheck.checked) return targetHz;

                const baselineHz = 15.0; // Waking state
                const rampTime = durationMs * 0.15; // 15% of session for transitions

                if (elapsed < rampTime) {
                    const progress = elapsed / rampTime;
                    return baselineHz + ((targetHz - baselineHz) * progress);
                } else if (elapsed > (durationMs - rampTime)) {
                    const timeInPhase3 = elapsed - (durationMs - rampTime);
                    const progress = timeInPhase3 / rampTime;
                    return targetHz + ((baselineHz - targetHz) * progress);
                } else {
                    return targetHz;
                }
            }

            function flickerLoop(timestamp) {
                if (!isRunning) return;

                const elapsed = timestamp - startTime;
                
                if (elapsed >= durationMs) {
                    stopSession();
                    return;
                }

                const currentHz = getCurrentHz(elapsed);
                const interval = 1000 / (currentHz * 2);

                if (timestamp - lastTime >= interval) {
                    state = !state;
                    document.body.style.backgroundColor = state ? '#ffffff' : '#000000';
                    lastTime = timestamp;
                }

                animationFrameId = requestAnimationFrame(flickerLoop);
            }
        });
    </script>
</body>
</html>
