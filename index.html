<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Photic Strobe Utility</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            text-align: center;
            z-index: 10;
            background: rgba(0, 0, 0, 0.85);
            padding: 24px;
            border-radius: 12px;
            max-width: 340px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        select, button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            font-size: 16px;
            border-radius: 6px;
            border: none;
            outline: none;
        }
        select {
            background: #374151;
            color: #fff;
            cursor: pointer;
        }
        button {
            background: #2563eb;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #1d4ed8;
        }
        .warning {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 12px;
            line-height: 1.4;
        }
        label {
            display: block;
            text-align: left;
            font-size: 14px;
            color: #d1d5db;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h2>Photic Strobe Engine</h2>
        <p class="warning">REMINDER: Enable Do Not Disturb on your device before starting to prevent notification flashes.</p>
        
        <label for="freq">Select Target State (EEG Band):</label>
        <select id="freq">
            <option value="6">6 Hz - Theta (Deep Calm / Meditation)</option>
            <option value="10" selected>10 Hz - Alpha (Relaxation / Rest)</option>
            <option value="18">18 Hz - Beta (Focus & Alertness)</option>
            <option value="40">40 Hz - Gamma (Cognitive Synchronization)</option>
            <option value="2.5">2.5 Hz - Low Delta (Sensory Modulation)</option>
        </select>
        
        <button id="startBtn">Start Session</button>
    </div>

    <script>
        const ui = document.getElementById('ui');
        const startBtn = document.getElementById('startBtn');
        const freqSelect = document.getElementById('freq');
        
        let isRunning = false;
        let lastTime = 0;
        let state = false;
        let animationFrameId = null;

        startBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(err);
                });
            }
            ui.style.display = 'none';
            isRunning = true;
            lastTime = performance.now();
            requestAnimationFrame(flickerLoop);
        });

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement && isRunning) {
                stopSession();
            }
        });

        // Tap screen to exit fullscreen and return to menu
        document.body.addEventListener('click', (e) => {
            if (isRunning && e.target === document.body) {
                stopSession();
            }
        });

        function stopSession() {
            isRunning = false;
            cancelAnimationFrame(animationFrameId);
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(() => {});
            }
            ui.style.display = 'block';
            document.body.style.backgroundColor = '#000';
        }

        function flickerLoop(timestamp) {
            if (!isRunning) return;

            const hz = parseFloat(freqSelect.value);
            const interval = 1000 / (hz * 2); // Toggle rate for full cycle

            if (timestamp - lastTime >= interval) {
                state = !state;
                document.body.style.backgroundColor = state ? '#ffffff' : '#000000';
                lastTime = timestamp;
            }

            animationFrameId = requestAnimationFrame(flickerLoop);
        }
    </script>
</body>
</html>
